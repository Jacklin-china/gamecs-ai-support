[project]
name = "gamecs-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pymysql>=1.1,<2",
  "pyjwt>=2.10,<3", "bcrypt>=4.2,<5", "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7", "celery[redis]>=5.4,<6", "minio>=7.2,<8",
  "langgraph>=1.0,<2", "langchain-core>=1.0,<2", "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-redis>=0.1,<1", "langchain-redis>=0.2,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
